server:
  port: 9200
spring:
  application:
    name: favorite-service
  datasource:
    url: jdbc:mysql://localhost:3306/favorite_db?useSSL=false&serverTimezone=UTC
    username: root
    password: LG101799
    driver-class-name: com.mysql.cj.jdbc.Driver
  profiles:
    active: dev
  config:
    import: "optional:configserver:"  # 关键修复！必须添加！
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启SQL日志
  global-config:
    db-config:
      logic-delete-field: deleted # 逻辑删除字段名
      logic-not-delete-value: 0   # 逻辑未删除值
      logic-delete-value: 1      # 逻辑删除值
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka