server:
  port: 9406

eureka:
  client:
    register-with-eureka: true    # 启用注册
    fetch-registry: true          # 获取注册表
    service-url:
      defaultZone: http://localhost:8761/eureka  # Eureka 地址
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always

# Fanout服务自定义配置
fanout:
  event:
    queue: fanout.event.queue
    processed-ttl: 86400  # 已处理事件缓存时间（秒）

  fans:
    batch-size: 1000       # 粉丝查询批次大小
    vip-threshold: 50000   # 大V粉丝量阈值

  retry:
    max-times: 3           # 最大重试次数
    interval: 300000       # 重试间隔（毫秒）

  rules:
    - message-type: DYNAMIC_PUBLISH
      targets:
        - type: QUEUE
          name: dynamic.exchange
          routingKey: dynamic.storage.key

    - message-type: DYNAMIC_TOPLIST
      targets:
        - type: QUEUE
          name: notification.queue
          routingKey: notification.toplist.key
        - type: QUEUE
          name: dynamic.statistics.queue
          routingKey: statistics.toplist.key

    - message-type: DYNAMIC_DELETE
      targets:
        - type: QUEUE
          name: dynamic.storage.queue
          routingKey: dynamic.delete.key

    - message-type: LIKE_CANCEL
      targets:
        - type: QUEUE
          name: dynamic.storage.queue
          routingKey: dynamic.like.cancel.key
        - type: QUEUE
          name: notification.queue
          routingKey: notification.like.cancel.key

    - message-type: USER_REGISTER
      targets:
        - type: QUEUE
          name: notification.exchange
          routingKey: notification.register.key
    - message-type: COMMENT_EVENT
      targets:
        - type: QUEUE
          name: notification.exchange
          routingKey: notification.user.comment
    - message-type: LIKE_EVENT
      targets:
        - type: QUEUE
          name: notification.exchange
          routingKey: notification.user.like
    - message-type: QUOTE_EVENT
      targets:
        - type: QUEUE
          name: notification.exchange
          routingKey: notification.user.quote
  cache:
    redis:
      fans-key-prefix: "follow:fans:"        # 粉丝列表缓存前缀
      count-key-prefix: "follow:count:"      # 粉丝数量缓存前缀
      user-info-prefix: "user:info:"         # 用户信息缓存前缀
      processed-key-prefix: "fanout:processed:"  # 已处理事件缓存前缀
      mute-key-prefix: "user:mute:"          # 用户屏蔽列表缓存前缀
      ttl: 3600           # 缓存有效期（秒）
