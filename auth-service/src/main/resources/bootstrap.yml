server:
  port: 9000

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/authdb?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: LG101799
    driver-class-name: com.mysql.cj.jdbc.Driver
  config:
    import: "optional:configserver:"  # 关键修复！必须添加！
  security:
    oauth2:
      authorization:
        client:
          client-id: client
          client-secret: secret
  application:
    name: auth-service
  cloud:
    bootstrap:
      enabled: true
    config:
      discovery:
        enabled: true
        service-id: config-server

