spring:
  cloud:
    config:
      discovery:
        enabled: true                 # 开启服务发现方式拉取配置
        service-id: config-server     # 指定配置中心服务名（注册到 Eureka 的名字）
      profile: dev                    # 拉取的配置环境（对应 product-service-dev.yml）
      name: like-service           # 拉取的配置文件名（不含 profile 和扩展名）

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka