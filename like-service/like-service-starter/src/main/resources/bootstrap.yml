server:
  port: 9101 #启动端口号
spring:
  application:
    name: like-service #服务名
  main:
    allow-bean-definition-overriding: true
    allow-circular-reference: true
  cloud:
    nacos:
      discovery:
        ip: 192.168.0.105
        #register-enabled: false
        server-addr: 115.191.9.196:8848
        username: nacos
        password: nacos
        namespace: public
        connect-timeout: 30000
      config:
        server-addr: 115.191.9.196:8848 #nacos服务地址
        username: nacos
        password: nacos
        file-extension: yml #配置文件后缀
        namespace: public

        shared-configs:
          - data-id: application-${spring.profiles.active}.yml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: shared-datasource-${spring.profiles.active}.yml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: shared-redis-${spring.profiles.active}.yml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: shared-mongodb-${spring.profiles.active}.yml
            group: DEFAULT_GROUP
            refresh: true
  profiles:
    active: dev #指定环境
like:
  hot-list:
    enabled: true
    preload-on-startup: true
    refresh-interval-minutes: 10
    refresh-limit: 200
    all-default-window-hours: 72
    daily-window-hours: 24
    weekly-window-hours: 168
    monthly-window-hours: 720
    rising-window-hours: 24
    rising-previous-window-hours: 24
    rising-min-current-likes: 10
