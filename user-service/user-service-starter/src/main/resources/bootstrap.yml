spring:
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848    # Nacos服务器地址
      config:
        server-addr: localhost:8848    # Nacos配置中心地址
        file-extension: yaml           # 配置文件格式
  config:
    import:
      - nacos:user-service-dev.yaml   # 从Nacos加载配置文件

spring:
  application:
    name: user-service