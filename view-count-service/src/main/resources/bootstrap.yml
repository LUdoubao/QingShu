spring:
  cloud:
    config:
      discovery:
        enabled: true                 # 开启服务发现方式拉取配置
        service-id: config-server     # 指定配置中心服务名（注册到 Eureka 的名字）
      profile: dev                    # 拉取的配置环境（对应 product-service-dev.yml）
      name: view-count-service           # 拉取的配置文件名（不含 profile 和扩展名）

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
# 浏览量配置
view-count:
  valid-duration: 5 # 详情页有效浏览时长(秒)
  list-valid-duration: 3 # 列表页有效浏览时长(秒)
  duplicate-time-window: 86400 # 去重时间窗口(秒) 24*60*60
  hot-content-threshold: 1000 # 热点内容阈值(1小时内浏览量)
  ip-limit-count: 10 # 单IP段每分钟最大有效请求数
  ip-limit-period: 60 # IP限制周期(秒)
  correction-notify-threshold: 10 # 数据校正通知阈值(百分比)
