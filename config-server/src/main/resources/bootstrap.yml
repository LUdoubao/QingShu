spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://gitee.com/LGdoubao/config-repo.git # 替换为你自己的 Git 仓库TODO
          searchPaths: config-repo
          default-label: master
  profiles:
    active: native  # 启动默认使用本地配置，实际部署切换为 git
  main:
    allow-bean-definition-overriding: true

server:
  port: 8888
