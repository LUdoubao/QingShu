server:
  port: 8080

spring:
  application:
    name: quote-recommend-stage1
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/quote_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
  type-aliases-package: com.example.recommend.domain

logging:
  level:
    com.example.recommend: info
    org.doubao.recommend.service.job: debug
    org.springframework.scheduling: debug

recommend:
  hot:
    top-n: 200
  candidate:
    max-size: 200
  precompute:
    active-user-top-n: 1000
